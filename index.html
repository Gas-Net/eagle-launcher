<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eagle-Launcher</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            overflow: hidden;
            background: #111;
            color: white;
            font-family: "Trebuchet MS", Arial, sans-serif;
        }

        /* =========================================================
           MINECRAFT-STYLE BACKGROUND
           ========================================================= */

        .background {
            position: fixed;
            inset: 0;
            z-index: -10;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.08),
                    rgba(0, 0, 0, 0.35)
                ),
                repeating-linear-gradient(
                    0deg,
                    #744a2c 0px,
                    #744a2c 7px,
                    #684128 7px,
                    #684128 14px
                );
        }

        /* Dirt pixel texture */
        .background::before {
            content: "";
            position: absolute;
            inset: 0;

            opacity: 0.35;

            background-image:
                radial-gradient(circle at 10% 20%, #4e301f 0 4px, transparent 5px),
                radial-gradient(circle at 35% 65%, #9a633a 0 3px, transparent 4px),
                radial-gradient(circle at 70% 30%, #50311f 0 5px, transparent 6px),
                radial-gradient(circle at 85% 75%, #a06a3d 0 3px, transparent 4px),
                radial-gradient(circle at 55% 90%, #4c2e1e 0 4px, transparent 5px),
                radial-gradient(circle at 20% 85%, #986039 0 3px, transparent 4px);
            
            background-size: 180px 150px;
        }

        /* Grass at the top */
        .grass {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;

            height: 45px;

            background:
                repeating-linear-gradient(
                    90deg,
                    #3f8f25 0px,
                    #3f8f25 8px,
                    #4da52c 8px,
                    #4da52c 16px,
                    #367c20 16px,
                    #367c20 24px
                );

            border-bottom: 6px solid #51351f;

            box-shadow:
                0 5px 0 rgba(0, 0, 0, 0.4),
                inset 0 -4px 0 rgba(0, 0, 0, 0.2);
        }

        /* Dark overlay */
        .overlay {
            position: fixed;
            inset: 0;

            background:
                radial-gradient(
                    ellipse at center,
                    transparent 20%,
                    rgba(0, 0, 0, 0.38) 100%
                );

            pointer-events: none;
        }

        /* =========================================================
           MAIN LAUNCHER
           ========================================================= */

        .launcher {
            width: min(900px, 92vw);

            position: absolute;
            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            text-align: center;
        }

        /* =========================================================
           LOGO
           ========================================================= */

        .logo {
            display: inline-block;

            margin-bottom: 8px;

            font-family:
                "Arial Black",
                Impact,
                sans-serif;

            font-size: clamp(42px, 8vw, 82px);

            font-weight: 900;

            letter-spacing: 3px;

            color: #ffffff;

            transform: scaleX(0.95);

            text-shadow:
                4px 0 #333,
                -2px 0 #333,
                0 4px #333,
                4px 4px #111,
                7px 7px #111;
        }

        .logo-eagle {
            color: #eeeeee;
        }

        .logo-launcher {
            color: #ffffff;
        }

        .subtitle {
            margin-top: 2px;
            margin-bottom: 32px;

            font-size: 18px;
            font-weight: bold;

            color: #eeeeee;

            text-shadow:
                2px 2px 0 #222,
                3px 3px 0 #111;
        }

        /* =========================================================
           BUTTONS
           ========================================================= */

        .buttons {
            width: min(650px, 100%);

            margin: 0 auto;

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 14px;
        }

        .minecraft-button {
            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 68px;

            padding: 12px 20px;

            text-decoration: none;

            color: #ffffff;

            font-size: 19px;
            font-weight: bold;

            text-shadow:
                2px 2px 0 #333,
                3px 3px 0 #111;

            /* Main button */
            background: #777777;

            /* Minecraft-style pixel border */
            border-top: 4px solid #bdbdbd;
            border-left: 4px solid #bdbdbd;

            border-right: 4px solid #373737;
            border-bottom: 4px solid #373737;

            box-shadow:
                0 5px 0 #111,
                inset 0 0 0 2px #555555;

            cursor: pointer;

            transition:
                transform 0.08s ease,
                background 0.08s ease;
        }

        /* Small shine across the top */
        .minecraft-button::before {
            content: "";

            position: absolute;

            top: 5px;
            left: 5px;
            right: 5px;

            height: 3px;

            background: rgba(255, 255, 255, 0.12);

            pointer-events: none;
        }

        /* Hover */
        .minecraft-button:hover {
            background: #8b8b8b;

            transform: translateY(-2px);

            border-top-color: #ffffff;
            border-left-color: #ffffff;

            box-shadow:
                0 7px 0 #111,
                inset 0 0 0 2px #666666;
        }

        /* Click */
        .minecraft-button:active {
            background: #686868;

            transform: translateY(4px);

            border-top-color: #373737;
            border-left-color: #373737;

            border-right-color: #bdbdbd;
            border-bottom-color: #bdbdbd;

            box-shadow:
                0 1px 0 #111,
                inset 0 0 0 2px #444444;
        }

        /* =========================================================
           VERSION TEXT
           ========================================================= */

        .version {
            position: relative;
            z-index: 1;
        }

        /* =========================================================
           FOOTER
           ========================================================= */

        .footer {
            margin-top: 30px;

            font-size: 13px;

            color: #d0d0d0;

            text-shadow:
                2px 2px 0 #222;
        }

        /* =========================================================
           SMALL SCREEN
           ========================================================= */

        @media (max-width: 650px) {
            body {
                overflow-y: auto;
            }

            .launcher {
                position: relative;

                left: auto;
                top: auto;

                transform: none;

                margin: 90px auto 40px;
            }

            .buttons {
                grid-template-columns: 1fr;
            }

            .minecraft-button {
                min-height: 62px;
            }

            .logo {
                font-size: 45px;
            }

            .subtitle {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- Background -->
    <div class="background"></div>
    <div class="grass"></div>
    <div class="overlay"></div>


    <!-- Launcher -->
    <main class="launcher">

        <!-- Logo -->
        <div class="logo">
            <span class="logo-eagle">EAGLE</span><span class="logo-launcher">-LAUNCHER</span>
        </div>

        <div class="subtitle">
            Select a Minecraft version
        </div>


        <!-- =====================================================
             CHANGE THE 4 BUTTONS BELOW
             ===================================================== -->

        <div class="buttons">

            <!-- BUTTON 1 -->
            <a class="minecraft-button" href="26.2.html">
                <span class="version">
                    EaglerCraft 26.2
                </span>
            </a>


            <!-- BUTTON 2 -->
            <a class="minecraft-button" href="1.21.11.html">
                <span class="version">
                    EaglerCraft 1.21.11
                </span>
            </a>


            <!-- BUTTON 3 -->
            <a class="minecraft-button" href="1.12.2.html">
                <span class="version">
                    EaglerCraft 1.12.2
                </span>
            </a>


            <!-- BUTTON 4 -->
            <a class="minecraft-button" href="1.8.8.html">
                <span class="version">
                    EaglerCraft 1.8.8
                </span>
            </a>

        </div>


        <div class="footer">
            Eagle-Launcher
        </div>

    </main>

</body>
</html>
